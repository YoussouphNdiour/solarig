---
# Déploiement cPanel (Git Version Control > Deploy HEAD Commit) :
# copie le site généré (public/) vers la racine du domaine solarig.sn.
# À adapter si le dossier du domaine diffère de ~/solarig.sn.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/solarig.sn/
    - /bin/cp -R public/. $DEPLOYPATH
